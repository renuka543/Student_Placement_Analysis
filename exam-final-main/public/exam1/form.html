<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> <!-- Font Awesome CDN -->
    <style>

</head>
<body>

<div class="container">
    <h2>Student Details</h2>
    <form id="examForm" onsubmit="startExam(event)">
        <div class="input-container">
            <i class="fas fa-user"></i>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="input-container">
            <i class="fas fa-cogs"></i>
            <label for="section">Section:</label>
            <select id="section" name="section" required>
                <option value="cse1">CSE1</option>
                <option value="cse2">CSE2</option>
                <option value="cse3">CSE3</option>
                <option value="cse4">CSE4</option>
                <option value="cse5">CSE5</option>
                <option value="cse6">CSE6</option>
            </select>
        </div>

        <div class="input-container">
            <i class="fas fa-envelope"></i>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="input-container">
            <i class="fas fa-phone-alt"></i>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <button type="submit">Start Exam</button>
    </form>
</div>

<script>
    function startExam(event) {
        event.preventDefault();  // Prevent form submission

        // Get the form data
        const form = document.getElementById('examForm');
        const formData = new FormData(form);

        // You can process the form data here if needed, for now, it will just redirect

        // Redirect to codingexam.html after form submission
        window.location.href = 'codingexam.html';
    }
</script>

</body>
</html>
