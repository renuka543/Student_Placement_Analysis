<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> <!-- Font Awesome CDN -->
    <style>
        /* Styles (same as your original styles) */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            animation: fadeIn 1s ease-out;
        }

        .container {
            width: 40%;
            margin: 100px auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            animation: slideUp 1s ease-out;
        }

        h2 {
            text-align: center;
            animation: fadeIn 2s ease-out;
        }

        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
        }

        .input-container {
            position: relative;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px 30px 10px 35px; /* Adjusted padding for space for icons */
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: 0.3s;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        input:focus, select:focus {
            border-color: #4b6584;
            box-shadow: 0 0 5px rgba(75, 101, 132, 0.7);
        }

        .input-container i {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #4b6584;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4b6584;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #3a4b64;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

    </style>
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Details</h2>
        <form id="examForm" onsubmit="startExam(event)">
            <div class="input-container">
                <i class="fas fa-user"></i>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
    
            <div class="input-container">
                <i class="fas fa-cogs"></i>
                <label for="section">Section:</label>
                <select id="section" name="section" required>
                    <option value="cse1">CSE1</option>
                    <option value="cse2">CSE2</option>
                    <option value="cse3">CSE3</option>
                    <option value="cse4">CSE4</option>
                    <option value="cse5">CSE5</option>
                    <option value="cse6">CSE6</option>
                </select>
            </div>
    
            <div class="input-container">
                <i class="fas fa-envelope"></i>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
    
            <div class="input-container">
                <i class="fas fa-phone-alt"></i>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
    
            <button type="submit">Start Exam</button>
        </form>
    </div>
    
    <script>
        function startExam(event) {
            event.preventDefault();  // Prevent form submission
    
            // Get the form data
            const form = document.getElementById('examForm');
            const formData = new FormData(form);
    
            // Prepare data for backend
            const data = {
                name: formData.get('name'),
                section: formData.get('section'),
                email: formData.get('email'),
                phone: formData.get('phone'),
            };
    
            // Save form data to localStorage
            localStorage.setItem('name', data.name);
            localStorage.setItem('email', data.email);
    
            // Send data to the server
            fetch('http://localhost:5002/submitFormDataAndResults', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                alert('Form and results saved successfully!');
                window.location.href = 'codingexam.html';  // Redirect to results page
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to save data');
            });
        }
    </script>
    
    </body>
</html>
